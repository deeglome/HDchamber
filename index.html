<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HDchamber</title>
    <link rel="shortcut icon" href="#" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="src/style.css" />
    <link rel="shortcut icon" href="/logo.svg" type="image/x-icon" />
    <script src="https://kit.fontawesome.com/7fe70165d0.js" crossorigin="anonymous"></script>
    <script type="module" defer src="src/geolib_old.js"></script>
    <script type="module" defer src="src/main.js"></script>
    <script type="module" defer src="src/cross-section.js"></script>
    <script type="module" defer src="src/render.js"></script>
  </head>
  <body>
    <ul class="left buttons">
      <li>
        <a class="button esc" href="javascript:history.go(-1)">
          <div class="icon" style="--icon-url: url('/icons/back.svg');" role="img" aria-label="Go back"></div>
        </a>
      </li>
      <li>
        <button class="button rotation-handler" title="Edit rotations">
          <div class="icon" style="--icon-url: url('/icons/rotation-icon.png');" role="img" aria-label="Rotation icon"></div>
        </button>
        <div class="dropmenu left">
          <ul class="planes"></ul>
          <ul class="tools buttons">
            <li>
              <button class="button small random-btn">
                <div class="icon" style="--icon-url: url('/icons/random.svg');" role="img" aria-label="Random rotation" title="Generate a random rotation!"></div>
              </button>
            </li>
            <li>
              <button class="button small clear-btn">
                <div class="icon" style="--icon-url: url('/icons/clear.svg');" role="img" aria-label="Clear rotation"></div>
              </button>
            </li>
            <li>
              <button class="button small radian-btn active">Radian</button>
            </li>
            <li>
              <button class="button small degree-btn">Degree</button>
          </li>
          </ul>
        </div>
      </li>
      <li class="meshes-handler" title="Select a mesh to render!">
        <button class="button">
          <div class="icon" style="--icon-url: url('/icons/box_btn.svg');" role="img" aria-label="Box button"></div>
        </button>
        <ul class="dropmenu left"></ul>
      </li>
      <li>
        <button class="button projection-mode" title="Enable orthogonal projection">
          <div class="icon" style="--icon-url: url('/icons/ortho.png');" role="img" aria-label="orto_off"></div>
        </button>
      </li>
      <li>
        <button class="button pause-btn" title="Pause">
          <div class="icon" style="--icon-url: url('/icons/pause.svg');" role="img" aria-label="Pause icon"></div>
        </button>
      </li>
      <li>
        <button class="button zoom-in-btn" title="Zoom In">
          <div class="icon" style="--icon-url: url('/icons/zoom_in.svg');" role="img" aria-label="Zoom In icon"></div>
        </button>
      </li>
      <li>
        <button class="button zoom-out-btn" title="Zoom Out">
          <div class="icon" style="--icon-url: url('/icons/zoom_out.svg');" role="img" aria-label="Zoom Out icon"></div>
        </button>
      </li>
    </ul>


    <ul class="right buttons">
      <li>
        <button class="button wiki" title="Open the Wiki">
          <div style="--icon-url: url('/icons/wiki.png');" class="icon" role="img" aria-label="Open the Wiki"></div>
        </button>
        <div class="wikipage">
          <h3>Welcome to the Wiki!</h3>
          <p>Select a mesh to see its documentation!</p>
        </div>
      </li>
      <li>
        <button class="button dimensions-handler" title="Select the number of dimensions to render!">
          <div class="icon" style="--icon-url: url('/icons/dimension_btn.svg');" role="img" aria-label="Dimension Button"></div>
        </button>
        <div class="dropmenu right">
          <p>
          n =
          <input type="number" class="dimensions-input" min="2" max="6" value="3" title="Select the number of dimensions to render!" />. Press <strong>Enter</strong> to update.</p>
        </div>
      </li>
      <li>
        <button class="button color-map-mode" title="Enable Color Map mode">
          <div class="icon" style="--icon-url: url('/icons/color-map.svg');" role="img" aria-label="Last coordinate icon"></div>
        </button>
      </li>
      <li>
        <button class="button cross-section-mode" title="Enable cross-section mode">
          <div class="icon" style="--icon-url: url('/icons/cross_section_view_on_btn.svg');" role="img" aria-label="Cross-section mode icon"></div>
        </button>
        <div class="dropmenu right">
          <div class="cross-section-mode">
            <div class="hyperplane"></div>
            <ul class="states buttons">
              <li><button class="button small active" data-state="off">Off</button></li>
              <li><button class="button small" data-state="absolute">Absolute</button></li>
              <li><button class="button small" data-state="relative">Relative</button></li>
            </ul>
          </div>
        </div>
      </li>
      <li>
        <button class="button axes" title="Enable fixed axes">
          <div class="icon" style="--icon-url: url('/icons/cartesian_axes_view_locked_btn.svg');" role="img" aria-label="Axes icon"></div>
        </button>
      </li>
      <li>
        <button class="button camera" title="Camera options">
          <div class="icon" style="--icon-url: url('/icons/camera.png');" role="img" aria-label="Camera icon"></div>
        </button>
        <div class="dropmenu right"></div>
      </li>
      <li>
        <button class="button developer-mode" title="Developer Mode">
          <div class="icon" style="--icon-url: url('/icons/developer_mode.svg');" role="img" aria-label="Developer Mode icon"></div>
        </button>
      </li>
    </ul>


    <main>
      <h1>HDchamber</h1>
      <canvas class="renderer"></canvas>
      <legend class="hidden">
        <label for="...">W Coordinate</label>
        <div class="legend-bar"></div>
        <div class="legend-values">
          <span class="legend-value" id="min-legend-value">0</span>
          <span class="legend-value" id="mid-legend-value">0</span>
          <span class="legend-value" id="max-legend-value">0</span>
        </div>
      </legend>
      <div class="developer-data hidden"></div>
      <ul class="info">
        <span class="version">v1.5.2 (beta)</span>
        <span class="credits">Powered by <a href="https://github.com/deeglome" target="_blank" class="github-link">@deeglome (Davide Garbato)</a> &copy; 2024-2026</span>
      </ul>
    </main>
  </body>
  <script>
    // function to print wait for new version
    function wait() {
      alert("Wait for the next version for this functionality.");
    }
  </script>
</html>
